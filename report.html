<style>
.conv{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.conv th,.conv td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.conv th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.affirm{font-style:italic;font-size:15px;color:var(--a3);margin-top:8px}

<div class="wrap sect" style="position:relative"><div class="aura"></div>
  <div class="rscreen">
  <div class="eyebrow">Report &middot; the one people pay for elsewhere</div>
  <h1 style="font-size:clamp(34px,6vw,52px)" id="rtitle">Report</h1>
  <p class="lede" id="rlede"></p>
  <div class="rpick" id="rpick"></div>

  <div class="grid g2" style="margin-top:18px;align-items:start">
    <div class="card pad" id="form">
      <div class="row2">
        <div><label class="f" for="nm" id="nmlabel">Name</label><input id="nm" value="You"></div>
        <div><label class="f" for="bd">Birth date</label><input id="bd" type="date" value="1992-07-11"></div>
      </div>
      <div class="row2" style="margin-top:12px">
        <div><label class="f" for="bt">Birth time</label><input id="bt" type="time" value="14:20"></div>
        <div><label class="f" for="bp">Birth place</label><input id="bp" placeholder="Start typing a city"></div>
      </div>
      <label class="check"><input type="checkbox" id="bu"> Birth time unknown</label>
      <fieldset class="row" id="pprow" style="margin-top:14px;display:none;border:0;padding:0"><legend class="f" style="margin-bottom:8px">Your partner</legend>
        <div class="row2">
          <div><label class="f" for="pnm">Name</label><input id="pnm" value="Partner"></div>
          <div><label class="f" for="pbd">Birth date</label><input id="pbd" type="date" value="1989-11-03"></div>
        </div>
        <div class="row2" style="margin-top:12px">
          <div><label class="f" for="pbt">Birth time</label><input id="pbt" type="time" value="08:45"></div>
          <div><label class="f" for="pp">Birth place</label><input id="pp" placeholder="Start typing a city"></div>
        </div>
        <label class="check"><input type="checkbox" id="pbu"> Birth time unknown</label></fieldset>
      <div class="row" id="nprow" style="margin-top:12px;display:none"><label class="f" for="np">Where you are now (the return chart is cast here)</label><input id="np" placeholder="Start typing a city"></div>
      <div class="row" id="rprow" style="margin-top:12px;display:none"><label class="f" for="rp">Place to read your chart for</label><input id="rp" placeholder="Start typing a city"></div>
      <button class="btn primary wide" id="go" style="margin-top:16px">Write the report</button>
      <div class="warn"><span class="k">Method, stated</span><p id="rmethod"></p>
        <p style="margin-top:8px">Everything is calculated in your browser; nothing is sent anywhere.</p></div>
    </div>
    <div class="res" id="covers" style="margin-top:0">
      <h3>What this report covers</h3>
      <p class="note" id="rcovers"></p>
      <p class="note" style="margin-top:8px">All reports: <a href="reports.html">the reports page</a>.</p>
      <button class="btn wide printbtn" type="button" data-report-print style="margin-top:12px">Print or save as PDF</button>
    </div>
  </div>
  </div>
  <div id="out"></div>
  <div class="adslot" style="margin-top:30px">Advertisement<b>Free tier only</b></div>
</div>
<script src="js/vendor/astronomy.browser.min.js"></script><script src="js/data/chiron.js"></script>

<script src="js/numerology.js"></script><script src="js/factors.js"></script><script src="js/tools.js"></script><script src="js/transits.js"></script><script src="js/chinese.js"></script><script src="js/data/extra-text.js"></script><script src="js/places.js"></script>
<script src="js/cards.js"></script><script src="js/data/correspondences.js"></script>
<script src="js/tour.js"></script><script src="js/site.js"></script><script src="js/reportpage.js"></script><script src="js/reports.js"></script>
<script>
(function(){
  const ids = Object.keys(TD.REPORTS);
  let id = new URLSearchParams(location.search).get('r');
  if (!TD.REPORTS[id]) id = 'lifepath';
  const R = TD.REPORTS[id], $ = x => document.getElementById(x);
  document.title = R.title + ' — tarot platform demo';
  $('rtitle').textContent = R.title;
  $('rlede').textContent = R.lede;
  $('rmethod').innerHTML = R.method;
  if (R.nameLabel) $('nmlabel').innerHTML = R.nameLabel;
  /* Only the field this report needs stays in the page: reportpage.js looks for #np / #rp / #pp. */
  ['now', 'reloc', 'partner'].forEach(k => { const row = $({ now: 'nprow', reloc: 'rprow', partner: 'pprow' }[k]); if (R.needs === k) row.style.display = ''; else row.remove(); });
  $('rpick').innerHTML = ids.map(k => `<a href="report.html?r=${k}"${k === id ? ' class="on" aria-current="page"' : ''}>${TD.REPORTS[k].title}</a>`).join('');
  TD.reportPage({ page: 'report.html', render: (ctx, H) => {
    const html = R.render(ctx, H);
    $('rcovers').innerHTML = [...html.matchAll(/<h2 class="rh2">([\s\S]*?)<\/h2>/g)].map((m, i) => `Chapter ${i + 1}, ${m[1].charAt(0).toLowerCase() + m[1].slice(1)}.`).join(' ');
    return html;
  }, cover: { kicker: R.kicker, title: R.title, card: R.card, caption: R.caption } });
})();
</script></body></html>
