<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Not found</title><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0710">
<!-- GitHub Pages serves this file for any missing path, however deep (/a/b/typo), so every
     link and asset here is absolute, with the repository prefix. It is not meant to be opened
     from a file: it only works on the published site. -->
<link rel="stylesheet" href="/tarot-platform-demo/css/base.css"></head><body>
<div class="wrap sect" style="position:relative;text-align:center"><div class="aura"></div>
  <div class="eyebrow" style="margin-top:40px">404</div>
  <h1 style="font-size:clamp(38px,8vw,72px)">Nothing<br><span class="prism">here</span></h1>
  <p class="lede" style="margin:16px auto 0">The card you turned over was blank. That happens.</p>
  <div style="display:flex;gap:11px;justify-content:center;margin-top:26px;flex-wrap:wrap">
    <a class="btn primary" href="/tarot-platform-demo/index.html">Back to the start</a>
    <a class="btn" href="/tarot-platform-demo/pull.html">Pull a card instead</a>
  </div>
</div>
<script src="/tarot-platform-demo/js/site.js"></script>
<script>
// The shared header and footer use page-relative links; rewrite them to absolute ones here.
TD.chrome('');
document.querySelectorAll('a[href]').forEach(a => {
  const h = a.getAttribute('href');
  if (!/^(https?:|\/|#|mailto:)/.test(h)) a.setAttribute('href', '/tarot-platform-demo/' + h);
});
</script></body></html>
